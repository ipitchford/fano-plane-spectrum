name: Producer replay
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python package.py check
      - run: python verify.py --artifacts-only
      - run: python -O verify.py --artifacts-only
      - run: python code/verify_eigenvectors.py
      - run: python test_negative.py
